<style>

y:block}.hero{border-radius:24px;padding:25px;color:white;background:linear-gradient(110deg,#6745f5 0%,#8a4df4 48%,#ef55a2 100%);position:relative;overflow:hidden;margin-bottom:20px}.hero:after{content:"";position:absolute;width:240px;height:240px;border:38px solid #ffffff20;border-radius:50%;right:-20px;top:-110px}.hero h2{font-size:25px;margin:5px 0}.hero p{color:#f1eaff;max-width:600px;margin:0 0 17px}.hero .eyebrow{color:var(--lime)}.hero button{background:var(--lime);color:#20273f}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat,.card{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 5px 22px #202c5006}.stat .label{color:var(--muted);font-size:12px;font-weight:700}.stat .num{font-size:28px;font-weight:900;letter-spacing:-1px;margin:6px 0}.stat .foot{font-size:11px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.contentgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:18px}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}.card h3{margin:0;font-size:15px}.pill{font-size:11px;border-radius:20px;padding:5px 9px;background:#effbf8;color:#168775;font-weight:800}.bars{display:grid;gap:13px}.barrow{display:grid;grid-template-columns:110px 1fr 28px;gap:9px;align-items:center;font-size:12px}.track{height:9px;border-radius:20px;background:#f0f1f8;overflow:hidden}.fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--purple),var(--pink))}.progress{height:10px;border-radius:20px;background:#eff0f8;overflow:hidden;margin:7px 0}.progress div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--lime))}.quick{display:flex;gap:8px;flex-wrap:wrap}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid #dfe3ef;border-radius:11px;padding:10px 12px;background:#fff;color:var(--ink);min-width:0}.toolbar input{flex:1;min-width:190px}.table{width:100%;border-collapse:collapse;white-space:nowrap}.table th{text-align:left;color:#778099;background:#fafbff;font-size:10px;letter-spacing:.8px;text-transform:uppercase;padding:13px 15px}.table td{padding:13px 15px;border-top:1px solid #eff1f7;font-size:12px}.table tr:hover td{background:#fcfcff}.tag{padding:4px 8px;border-radius:8px;font-size:10px;font-weight:850;background:#f0edff;color:#5d43d7}.tag.green{background:#e3fbf3;color:#15866c}.tag.red{background:#ffe9ef;color:#b6295c}.tag.yellow{background:#fff4db;color:#9c6a00}.fieldgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field label{font-size:11px;font-weight:800;color:#66708a}.field input,.field select,.field textarea{width:100%}.field.full{grid-column:1/-1}.formcard{margin-bottom:18px}.notice{padding:12px 14px;border-radius:12px;background:#f0edff;color:#5742bc;font-size:12px;margin:12px 0}.chart{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.donut{width:145px;height:145px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--purple) 0 28%,var(--pink) 28% 48%,var(--cyan) 48% 66%,var(--orange) 66% 80%,var(--lime) 80% 100%);position:relative}.donut:after{content:"";position:absolute;width:88px;height:88px;background:#fff;border-radius:50%}.donut span{z-index:1;font-size:20px;font-weight:900}.legend{display:grid;gap:8px;font-size:12px}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px}.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:#171d36}.loginart{padding:7vw;color:white;display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle at 15% 20%,#fb4fa3 0,transparent 24%),radial-gradient(circle at 80% 70%,#20c9d8 0,transparent 28%),linear-gradient(135deg,#5c43e9,#171d36 65%)}.loginart h1{font-size:clamp(36px,5vw,68px);line-height:1.02;letter-spacing:-3px;margin:22px 0}.loginart p{max-width:440px;color:#d9def5;font-size:16px}.loginbox{display:grid;place-items:center;padding:24px;background:#f8f9fd;border-radius:30px 0 0 30px}.loginform{width:min(390px,100%)}.loginform h2{font-size:29px;margin:6px 0}.loginform .field{margin:16px 0}.loginform button{width:100%;padding:13px}.error{color:#c22e60;font-size:12px;min-height:18px}.hidden{display:none!important}.small{font-size:11px;color:var(--muted)}.footer{color:#9aa2b7;font-size:11px;text-align:center;margin:24px 0 5px}
@media(max-width:900px){.side{width:76px;padding:18px 10px}.brand{justify-content:center}.brand div:last-child,.nav .navlabel,.sidefoot{display:none}.nav button{justify-content:center;font-size:0}.nav span{font-size:18px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.contentgrid{grid-template-columns:1fr}.fieldgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.login{grid-template-columns:1fr}.loginart{display:none}.loginbox{border-radius:0}}@media(max-width:520px){.main{padding:17px 12px}.stats{gap:8px}.stat{padding:13px}.stat .num{font-size:23px}.top h1{font-size:22px}.user .who{display:none}.fieldgrid{grid-template-columns:1fr}.hero{padding:19px}}

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const days=['2026-09-21','2026-09-22','2026-09-23','2026-09-24','2026-09-25'];
const trades=['Mason','Carpenter','Electrician','Plumber','Laborer','Steelman','Tile Setter','Painter','Welder','Foreman','Equipment Operator','Roofer','Glazier','Surveyor','Safety Officer'];
const names=['Marco Dela Cruz','Joshua Santos','Angelo Reyes','Miguel Garcia','Rafael Mendoza','Noel Bautista','Carlo Ramos','Paolo Flores','Jayson Lim','Dennis Villanueva','Erwin Torres','Adrian Castillo','Kevin Navarro','Bryan Aquino','Samuel Fernandez'];
const activities=[
['ACT-01','Site clearing','Remove vegetation, debris, and obstructions','m²',18],
['ACT-02','Excavation','Excavate footing and trench areas','m³',1.8],
['ACT-03','Rebar installation','Cut, bend, and install reinforcing bars','kg',12],
['ACT-04','Formwork installation','Install and brace concrete forms','m²',4.5],
['ACT-05','Concrete pouring','Place and compact structural concrete','m³',1.2],
['ACT-06','Blockwork','Lay concrete hollow blocks','m²',5],
['ACT-07','Plastering','Apply cement plaster to wall surfaces','m²',7],
['ACT-08','Tile installation','Set floor and wall tiles','m²',4],
['ACT-09','Electrical rough-in','Install conduits and electrical boxes','m',8],
['ACT-10','Painting','Prepare and coat wall surfaces','m²',12]];
function seed(){let workers=names.map((name,i)=>({id:'WRK-'+String(i+1).padStart(3,'0'),name,age:23+(i*3)%28,phone:'09'+String(171234560+i*137).slice(-9),trade:trades[i],type:i%3===0?'Regular':i%3===1?'Contractual':'Daily Wage',wage: [850,800,900,850,600,900,800,700,950,1100,950,850,850,900,1000][i],status:i===14?'Inactive':'Active',hired:`202${i%4}-0${i%8+1}-15`}));
let acts=activities.map(a=>({id:a[0],name:a[1],desc:a[2],unit:a[3],target:a[4],status:'Active'}));
let attendance=[],assignments=[],accomplishments=[],aid=1;
days.forEach((date,d)=>workers.forEach((w,i)=>{let status=(i+d*3)%17===0?'Absent':(i+d)%9===0?'Late':(i+d)%23===0?'Half-Day':'Present';let tin=status==='Late'?'08:20':'08:00',tout=status==='Absent'?'':status==='Half-Day'?'12:00':'17:00';let hours=status==='Absent'?0:status==='Half-Day'?3.5:8;let ot=hours===8&&((i+d)%11===0)?1:0;attendance.push({id:'ATT-'+String(aid++).padStart(3,'0'),workerId:w.id,date,timeIn:tin,timeOut:tout,status,hours,overtime:ot});assignments.push({id:'ASN-'+String(assignments.length+1).padStart(3,'0'),date,workerId:w.id,activityId:acts[(i+d)%acts.length].id,area:['Foundation Zone','Ground Floor','East Wing','Roof Deck','Utility Area'][(i+d)%5],supervisor:'Engr. Andrea Lim',status:d<2?'Completed':d===2?'In Progress':'Assigned'});}));
days.forEach((date,d)=>acts.forEach((a,i)=>{let planned=20+(i*7)%35,actual=planned*(.72+((d+i)%6)*.07);accomplishments.push({id:'ACP-'+String(accomplishments.length+1).padStart(3,'0'),date,activityId:a.id,team:trades[i],planned:+planned.toFixed(1),actual:+actual.toFixed(1),unit:a.unit,hours:Math.round((actual/a.target)*10)/10,area:['Foundation Zone','Ground Floor','East Wing','Roof Deck','Utility Area'][i%5],remarks:actual<planned*.85?'Check material flow and work sequence':'Progress within expected range'});}));
return {workers,activities:acts,attendance,assignments,accomplishments,users:[{username:'admin',password:'BuildCrew2026!',name:'Project Admin',role:'Administrator'}],session:null};}
let db;try{db=JSON.parse(localStorage.getItem('buildcrew_db'))||seed()}catch(e){db=seed()}if(!db.workers)db=seed();
function save(){localStorage.setItem('buildcrew_db',JSON.stringify(db));}
let current='Dashboard',searchText='',editId=null;
const icons={'Dashboard':'◈','Workers':'♟','Attendance':'◷','Assignments':'⇄','Activities':'▦','Accomplishments':'✦','Reports & Data':'▤','Settings':'⚙'};
function login(){ $('#root').innerHTML=`<div class="login"><div class="loginart"><div class="brand"><div class="logo">⌂</div><div><strong>BuildCrew</strong><small>LABOR INTELLIGENCE</small></div></div><h1>Build better.<br>Work smarter.</h1><p>A colorful command center for construction workforce, attendance, productivity, and labor costs.</p><div style="margin-top:35px;color:#d8ddf6;font-size:12px">✦ Workforce clarity · Daily progress · Better builds</div></div><div class="loginbox"><form class="loginform" id="loginForm"><div class="eyebrow">Welcome back</div><h2>Sign in to BuildCrew</h2><p class="sub">Your project operations, all in one place.</p><div class="field"><label>USERNAME</label><input name="username" value="admin" required autocomplete="username"></div><div class="field"><label>PASSWORD</label><input name="password" type="password" value="BuildCrew2026!" required autocomplete="current-password"></div><div class="error" id="loginError"></div><button>Enter workspace ↗</button><div class="notice"><b>Demo access</b><br>Username: admin<br>Password: BuildCrew2026!</div><p class="small">Prototype note: this demo stores data in this browser. Do not use real personal or payroll data.</p></form></div></div>`;
$('#loginForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),u=f.get('username'),p=f.get('password');let user=db.users.find(x=>x.username===u&&x.password===p);if(!user){$('#loginError').textContent='That login did not match. Try the demo credentials.';return}db.session={username:user.username,name:user.name,role:user.role};save();shell();};}
function shell(){if(!db.session){login();return}$('#root').innerHTML=`<div class="layout"><aside class="side"><div class="brand"><div class="logo">⌂</div><div><strong>BuildCrew</strong><small>LABOR INTELLIGENCE</small></div></div><div class="nav">${Object.keys(icons).map(n=>`<button data-page="${n}" class="${n===current?'active':''}"><span>${icons[n]}</span><span class="navlabel">${n}</span></button>`).join('')}</div><div class="sidefoot"><b>✦ FIELD NOTE</b>Strong teams build strong foundations. Track the details that keep your project moving.</div><button id="logout" class="ghost">↪ <span class="navlabel">Sign out</span></button></aside><main class="main"><header class="top"><div><div class="eyebrow">PROJECT CONTROL CENTER</div><h1 id="pageTitle">${current}</h1><div class="sub" id="pageSub">Workforce intelligence, made visual.</div></div><div class="user"><div class="avatar">BC</div><div class="who"><b>${db.session.name}</b><div class="small">${db.session.role}</div></div></div></header><div id="view"></div><div class="footer">BUILDCREW LMS · PLATE 2 · DEMO DATA FOR ACADEMIC USE</div></main></div>`;
$$('[data-page]').forEach(b=>b.onclick=()=>{current=b.dataset.page;searchText='';shell();});$('#logout').onclick=()=>{db.session=null;save();login()};render();}
function money(n){return '₱'+Number(n||0).toLocaleString('en-PH',{maximumFractionDigits:2})}
function worker(id){return db.workers.find(w=>w.id===id)||{name:'Unknown',trade:'—',wage:0}}
function act(id){return db.activities.find(a=>a.id===id)||{name:'Unknown activity',unit:'—',target:0}}
function laborCost(att){let w=worker(att.workerId);return (Math.min(att.hours,8)*w.wage/8)+(att.overtime*w.wage/8*1.25)}
function totals(){let today=days[days.length-1],atts=db.attendance.filter(a=>a.date===today);return {today,scheduled:db.workers.filter(w=>w.status==='Active').length,present:atts.filter(a=>a.status==='Present'||a.status==='Half-Day').length,absent:atts.filter(a=>a.status==='Absent').length,late:atts.filter(a=>a.status==='Late').length,hours:atts.reduce((s,a)=>s+a.hours,0),ot:atts.reduce((s,a)=>s+a.overtime,0),five:db.attendance.filter(a=>days.includes(a.date)).reduce((s,a)=>s+a.hours,0),cost:atts.reduce((s,a)=>s+laborCost(a),0)}}
function dashboard(){let t=totals(),tradeCounts={};db.workers.forEach(w=>tradeCounts[w.trade]=(tradeCounts[w.trade]||0)+1);let top=Object.entries(tradeCounts).sort((a,b)=>b[1]-a[1]).slice(0,7);let acts=db.activities.map(a=>{let rows=db.accomplishments.filter(x=>x.activityId===a.id),actual=rows.reduce((s,x)=>s+x.actual,0),hours=rows.reduce((s,x)=>s+x.hours,0);return {...a,actual,hours,rate:hours?actual/hours:0}});return `<section class="hero"><div class="eyebrow">✦ YOUR SITE, AT A GLANCE</div><h2>Every worker. Every hour. Every milestone.</h2><p>Keep your crew aligned, spot productivity gaps early, and turn daily site records into smarter decisions.</p><button onclick="go('Attendance')">+ Record today's attendance</button></section>
<div class="stats"><div class="stat"><div class="label">ACTIVE WORKFORCE</div><div class="num">${t.scheduled}</div><div class="foot"><span class="dot" style="background:var(--cyan)"></span>${db.workers.filter(w=>w.status==='Inactive').length} inactive in master data</div></div><div class="stat"><div class="label">PRESENT / HALF-DAY</div><div class="num">${t.present}<span style="font-size:13px;color:#8992aa"> / ${t.scheduled}</span></div><div class="foot"><span class="dot" style="background:var(--lime)"></span>Selected date: ${t.today}</div></div><div class="stat"><div class="label">LABOR HOURS · TODAY</div><div class="num">${t.hours.toFixed(1)}<span style="font-size:13px">h</span></div><div class="foot">${t.ot.toFixed(1)} overtime hours recorded</div></div><div class="stat"><div class="label">DAILY LABOR COST</div><div class="num" style="font-size:24px">${money(t.cost)}</div><div class="foot">Based on logged hours + 1.25× OT</div></div></div>
<div class="contentgrid"><div class="card"><div class="cardhead"><h3>Workforce by trade</h3><span class="pill">${db.workers.length} workers</span></div><div class="bars">${top.map(([n,v],i)=>`<div class="barrow"><span>${n}</span><div class="track"><div class="fill" style="width:${v/db.workers.length*100}%;background:${['#6d4aff','#ff4fa3','#20c9d8','#ff9e43','#8acb35','#7b8dff','#ef78c7'][i]}"></div></div><b>${v}</b></div>`).join('')}</div></div><div class="card"><div class="cardhead"><h3>Today's attendance pulse</h3><span class="pill">${t.today}</span></div><div class="chart"><div class="donut"><span>${t.present}</span></div><div class="legend"><div><i style="background:#6d4aff"></i>Present / half-day <b>${t.present}</b></div><div><i style="background:#ff4fa3"></i>Absent <b>${t.absent}</b></div><div><i style="background:#ff9e43"></i>Late <b>${t.late}</b></div><div><i style="background:#20c9d8"></i>Active workforce <b>${t.scheduled}</b></div></div></div><div class="notice">Attendance and cost figures use the selected demo date (${t.today}).</div></div></div>
<div class="contentgrid"><div class="card"><div class="cardhead"><h3>Productivity watchlist</h3><span class="pill">Target vs actual</span></div>${acts.slice(0,5).map(a=>{let pct=a.target?a.rate/a.target*100:0;return `<div style="margin:13px 0"><div style="display:flex;justify-content:space-between;gap:10px;font-size:12px"><b>${a.name}</b><span class="${pct<85?'tag red':'tag green'}">${pct.toFixed(0)}% of target</span></div><div class="progress"><div style="width:${Math.min(100,pct)}%"></div></div><div class="small">Actual ${a.rate.toFixed(2)} ${a.unit}/labor-hour · Target ${a.target} ${a.unit}/labor-hour</div></div>`}).join('')}</div><div class="card"><div class="cardhead"><h3>Five-day labor snapshot</h3><span class="pill">5 working days</span></div><div class="stat" style="background:#f8f7ff;border:0;margin-bottom:10px"><div class="label">TOTAL LABOR HOURS</div><div class="num">${t.five.toFixed(1)} h</div><div class="foot">Across ${db.attendance.filter(a=>days.includes(a.date)).length} attendance records</div></div><div class="stat" style="background:#fff4f9;border:0"><div class="label">MONTH-TO-DATE LABOR COST</div><div class="num" style="font-size:24px">${money(db.attendance.filter(a=>a.date.startsWith('2026-09')).reduce((s,a)=>s+laborCost(a),0))}</div><div class="foot">Computed from attendance hours and wage rates</div></div><div class="quick" style="margin-top:13px"><button class="ghost" onclick="go('Workers')">Manage workers</button><button class="ghost" onclick="go('Reports & Data')">Export records</button></div></div></div>`}
function go(page){current=page;shell()}
const configs={
'Workers':{title:'Worker Master Data',sub:'A single source of truth for your construction crew.',fields:[['id','Worker ID','text'],['name','Complete Name','text'],['age','Age','number'],['phone','Contact Number','text'],['trade','Trade / Specialization','trade'],['type','Employment Type','type'],['wage','Daily Wage Rate (₱)','number'],['status','Employment Status','status'],['hired','Date Hired','date']],rows:()=>db.workers,headers:['Worker ID','Name','Age','Contact','Trade','Employment Type','Daily Wage','Status','Date Hired'],cells:w=>[w.id,w.name,w.age,w.phone,w.trade,w.type,money(w.wage),w.status,w.hired]},
'Attendance':{title:'Attendance Management',sub:'Track time, status, worked hours, and overtime.',fields:[['id','Attendance ID','text'],['workerId','Worker','worker'],['date','Date','date'],['timeIn','Time In','time'],['timeOut','Time Out','time'],['status','Attendance Status','attstatus'],['overtime','Overtime Hours','number']],rows:()=>db.attendance,headers:['Attendance ID','Worker','Date','Time In','Time Out','Status','Hours','OT Hours','Labor Cost'],cells:a=>[a.id,worker(a.workerId).name,a.date,a.timeIn||'—',a.timeOut||'—',a.status,a.hours,a.overtime,money(laborCost(a))]},
'Assignments':{title:'Daily Labor Assignments',sub:'Put the right crew on the right work area.',fields:[['id','Assignment ID','text'],['date','Date','date'],['workerId','Worker','worker'],['activityId','Assigned Activity','activity'],['area','Project Location / Work Area','text'],['supervisor','Assigned Supervisor','text'],['status','Assignment Status','assignstatus']],rows:()=>db.assignments,headers:['Assignment ID','Date','Worker','Activity','Work Area','Supervisor','Status'],cells:a=>[a.id,a.date,worker(a.workerId).name,act(a.activityId).name,a.area,a.supervisor,a.status]},
'Activities':{title:'Work Activity Master Data',sub:'Define standard activities and productivity targets.',fields:[['id','Activity ID','text'],['name','Activity Name','text'],['desc','Description of Work','text'],['unit','Unit of Measurement','unit'],['target','Target Productivity / Labor-hour','number'],['status','Activity Status','status']],rows:()=>db.activities,headers:['Activity ID','Activity Name','Description','Unit','Target / Labor-hour','Status'],cells:a=>[a.id,a.name,a.desc,a.unit,a.target,a.status]},
'Accomplishments':{title:'Daily Accomplishment Records',sub:'Compare planned quantity, actual output, and productivity.',fields:[['id','Accomplishment ID','text'],['date','Date','date'],['activityId','Activity','activity'],['team','Assigned Worker / Work Team','text'],['planned','Planned Quantity','number'],['actual','Actual Accomplished Quantity','number'],['hours','Actual Labor Hours','number'],['area','Work Area','text'],['remarks','Remarks','text']],rows:()=>db.accomplishments,headers:['Record ID','Date','Activity','Worker / Team','Planned','Actual','Unit','Labor Hours','Productivity','Work Area','Remarks'],cells:a=>[a.id,a.date,act(a.activityId).name,a.team,a.planned,a.actual,a.unit,a.hours,(a.hours?a.actual/a.hours:0).toFixed(2)+' '+a.unit+'/h',a.area,a.remarks]}
};
function opts(type){let arr,placeholder;if(type==='worker'){arr=db.workers.map(w=>[w.id,`${w.id} · ${w.name}`]);placeholder='Select worker'}if(type==='activity'){arr=db.activities.map(a=>[a.id,`${a.id} · ${a.name}`]);placeholder='Select activity'}if(type==='trade')arr=[...new Set([...trades,...db.workers.map(w=>w.trade)])].map(x=>[x,x]);if(type==='type')arr=['Regular','Contractual','Daily Wage'].map(x=>[x,x]);if(type==='status')arr=['Active','Inactive'].map(x=>[x,x]);if(type==='attstatus')arr=['Present','Absent','Late','Half-Day'].map(x=>[x,x]);if(type==='assignstatus')arr=['Assigned','In Progress','Completed'].map(x=>[x,x]);if(type==='unit')arr=['m²','m³','linear meter','m','kg','pieces','hours'].map(x=>[x,x]);if(!arr)return '';return `<select name="${type}" ${placeholder?'required':''}>${placeholder?`<option value="">${placeholder}</option>`:''}${arr.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select>`}
function formField(f){let [key,label,type]=f;let value='';if(editId){let obj=configs[current].rows().find(x=>x.id===editId);value=obj?.[key]??''}if(key==='id'&&editId)value=editId;let control=opts(type);if(control){let name=type==='worker'?'workerId':type==='activity'?'activityId':type;return `<div class="field"><label>${label}</label>${control.replace(`name="${type}"`,`name="${name}" ${value?`data-value="${value}"`:''}`)}</div>`}let inputType=type==='date'?'date':type==='time'?'time':type==='number'?'number':'text';return `<div class="field"><label>${label}</label><input name="${key}" type="${inputType}" value="${value}" ${type==='number'?'step="any" min="0"':''} ${key==='id'&&editId?'readonly':''} ${key!=='id'?'required':''}></div>`}
function tablePage(){let c=configs[current],rows=c.rows().filter(r=>JSON.stringify(c.cells(r)).toLowerCase().includes(searchText.toLowerCase()));let form=editId?c.rows().find(x=>x.id===editId):null;return `${current==='Workers'?`<div class="notice">Starter dataset includes 15 workers representing varied construction trades. Sample records are editable; add records with the form below.</div>`:''}<div class="card formcard"><div class="cardhead"><h3>${editId?'Edit record':'Add new record'} · ${current}</h3><button class="ghost" onclick="resetForm()">${editId?'Cancel edit':'Clear form'}</button></div><form id="recordForm"><div class="fieldgrid">${c.fields.map(formField).join('')}</div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button type="submit">${editId?'Save changes':'＋ Save record'}</button></div></form></div><div class="toolbar"><input id="search" placeholder="Search ${current.toLowerCase()}..." value="${searchText}"><span class="pill">${rows.length} records</span><button class="ghost" onclick="exportCSV('${current}')">↓ Export CSV</button></div><div class="tablewrap"><table class="table"><thead><tr>${c.headers.map(h=>`<th>${h}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr>${c.cells(r).map((v,i)=>`<td>${i===c.headers.length-1&&['Active','Present','Completed','In Progress','Assigned','Inactive','Absent','Late','Half-Day'].includes(String(v))?`<span class="tag ${['Active','Present','Completed'].includes(String(v))?'green':['Absent','Inactive'].includes(String(v))?'red':'yellow'}">${v}</span>`:v}</td>`).join('')}<td><button class="ghost" onclick="editRecord('${r.id}')">Edit</button> <button class="danger" onclick="deleteRecord('${r.id}')">×</button></td></tr>`).join('')||`<tr><td colspan="${c.headers.length+1}" style="text-align:center;padding:30px">No records match your search.</td></tr>`}</tbody></table></div>`}
function renderReports(){let t=totals();return `<div class="stats"><div class="stat"><div class="label">WORKERS</div><div class="num">${db.workers.length}</div><div class="foot">Master data records</div></div><div class="stat"><div class="label">ATTENDANCE</div><div class="num">${db.attendance.length}</div><div class="foot">Minimum requirement: 75</div></div><div class="stat"><div class="label">ASSIGNMENTS</div><div class="num">${db.assignments.length}</div><div class="foot">Minimum requirement: 75</div></div><div class="stat"><div class="label">ACTIVITIES</div><div class="num">${db.activities.length}</div><div class="foot">Minimum requirement: 10</div></div></div><div class="contentgrid"><div class="card"><h3>Database structure</h3><p class="sub">BuildCrew uses linked records through Worker ID and Activity ID keys.</p><div class="notice"><b>Workers</b> → Attendance (Worker ID)<br><b>Workers</b> → Assignments (Worker ID)<br><b>Activities</b> → Assignments (Activity ID)<br><b>Activities</b> → Accomplishments (Activity ID)</div><p class="small">This downloadable prototype persists JSON records in browser localStorage; it demonstrates relational keys but is not a server-hosted SQL database.</p></div><div class="card"><h3>Quality checks</h3>${[['Workers ≥ 15',db.workers.length>=15],['Attendance ≥ 75',db.attendance.length>=75],['Assignments ≥ 75',db.assignments.length>=75],['Activities ≥ 10',db.activities.length>=10],['Five working days',days.every(d=>db.attendance.some(a=>a.date===d))]].map(([x,ok])=>`<p><span class="tag ${ok?'green':'red'}">${ok?'PASS':'CHECK'}</span> &nbsp;${x}</p>`).join('')}<p class="small">Starter data is illustrative and should be replaced or verified before submission.</p></div></div><div class="card"><div class="cardhead"><h3>Export and backup</h3><span class="pill">Your records</span></div><p class="sub">Download individual tables as CSV, or back up the entire local dataset as JSON.</p><div class="quick">${Object.keys(configs).map(k=>`<button class="ghost" onclick="exportCSV('${k}')">↓ ${k} CSV</button>`).join('')}<button onclick="backupJSON()">⬇ Full JSON backup</button><button class="danger" onclick="resetDemo()">Reset demo data</button></div></div>`}
function render(){let view=$('#view');$('#pageTitle').textContent=current;let c=configs[current];$('#pageSub').textContent=c?c.sub:current==='Dashboard'?'Workforce intelligence, made visual.':'Explore system status, data quality, and exports.';view.innerHTML=current==='Dashboard'?dashboard():c?tablePage():current==='Reports & Data'?renderReports():`<div class="card"><h3>Workspace settings</h3><p class="sub">Demo account and local data controls.</p><div class="notice">Signed in as <b>${db.session.username}</b>. This browser-only prototype does not provide production-grade password hashing, multi-user authorization, or cloud synchronization.</div><div class="quick"><button class="ghost" onclick="backupJSON()">Download backup</button><button class="danger" onclick="resetDemo()">Reset all demo data</button></div></div>`;
if($('#recordForm')){$('#recordForm').onsubmit=saveRecord;$$('#recordForm select').forEach(s=>{if(s.dataset.value)s.value=s.dataset.value;});$('#search').oninput=e=>{searchText=e.target.value;let pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}}
}
function resetForm(){editId=null;render()}function editRecord(id){editId=id;render();window.scrollTo({top:0,behavior:'smooth'})}
function saveRecord(e){e.preventDefault();let c=configs[current],data=Object.fromEntries(new FormData(e.target).entries());let obj={};c.fields.forEach(([key,label,type])=>{let val=data[key];if(type==='number')val=Number(val||0);obj[key]=val});if(current==='Attendance'){let mins=(s)=>{if(!s)return 0;let [h,m]=s.split(':').map(Number);return h*60+m};let hrs=obj.timeOut?Math.max(0,(mins(obj.timeOut)-mins(obj.timeIn))/60-.5):0;if(obj.status==='Absent')hrs=0;obj.hours=Math.round(hrs*100)/100;obj.overtime=Number(obj.overtime||0)}if(current==='Accomplishments'){obj.unit=act(obj.activityId).unit;obj.hours=Number(obj.hours||0);obj.actual=Number(obj.actual||0);obj.planned=Number(obj.planned||0)}if(!obj.id)obj.id=({Workers:'WRK-',Attendance:'ATT-',Assignments:'ASN-',Activities:'ACT-',Accomplishments:'ACP-'}[current])+String(Date.now()).slice(-6);let arr=c.rows(),idx=arr.findIndex(x=>x.id===editId);if(idx>=0)arr[idx]=obj;else arr.unshift(obj);save();editId=null;render()}
function deleteRecord(id){if(!confirm('Delete this record? Related records may still refer to its ID.'))return;configs[current].rows().splice(configs[current].rows().findIndex(x=>x.id===id),1);save();render()}
function exportCSV(name){let c=configs[name];let rows=c.rows(),head=c.headers;let csv=[head,...rows.map(r=>c.cells(r))].map(row=>row.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\r\n');download(`${name.toLowerCase().replaceAll(' ','_')}.csv`,csv,'text/csv;charset=utf-8')}
function backupJSON(){download('buildcrew_backup.json',JSON.stringify(db,null,2),'application/json')}
function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function resetDemo(){if(confirm('Reset all data to the original demo dataset? Your edits will be lost.')){db=seed();save();editId=null;shell()}}
login();
</script></body></html>
